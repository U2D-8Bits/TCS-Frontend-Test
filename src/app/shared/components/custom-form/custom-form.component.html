<div class="container-body">

  <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">

    <!-- Encabezado -->
    <div class="form-header">
      <h1>Formulario de {{ mode === 'add' ? 'Registro' : 'Edición' }}</h1>
    </div>

    <!-- Divisor -->
    <hr>

    <!-- Contenido del formulario -->
    <div class="form-content">

      <div class="form-group">
        <app-custom-input
          [label]="'ID'"
          [placeholder]="'ID del Producto'"
          [type]="'text'"
          formControlName="id"
          [showError]="!!getError('id')"
          [errorMessage]="getError('id') || ''"
        />
      </div>

      <div class="form-group">
        <app-custom-input
          [label]="'Nombre'"
          [placeholder]="'Nombre del Producto'"
          [type]="'text'"
          formControlName="name"
          [showError]="!!getError('name')"
          [errorMessage]="getError('name') || ''"
        />
      </div>

      <div class="form-group">
        <app-custom-input
          [label]="'Descripción'"
          [placeholder]="'Descripción del Producto'"
          [type]="'text'"
          formControlName="description"
          [showError]="!!getError('description')"
          [errorMessage]="getError('description') || ''"
        />
      </div>

      <div class="form-group">
        <app-custom-input
          [label]="'Logo'"
          [placeholder]="'Logo del Producto'"
          [type]="'text'"
          formControlName="logo"
          [showError]="!!getError('logo')"
          [errorMessage]="getError('logo') || ''"
        />
      </div>

      <div class="form-group">
        <app-custom-input
          [label]="'Fecha Liberación'"
          [placeholder]="'Fecha de Liberación del Producto'"
          [type]="'date'"
          formControlName="date_release"
          [showError]="!!getError('date_release')"
          [errorMessage]="getError('date_release') || ''"
        />
      </div>

      <div class="form-group">
        <app-custom-input
          [label]="'Fecha de Revisión'"
          [placeholder]="'Fecha de Revisión del Producto'"
          [type]="'date'"
          formControlName="date_revision"
          [showError]="!!getError('date_revision')"
          [errorMessage]="getError('date_revision') || ''"
        />
      </div>

    </div>

    <!-- Botones -->
    <div class="form-buttons">
      <app-custom-button
        [colorBoton]="'#FFDD00'"
        [ColorHoover]="'#FFDD00'"
        [colorTexto]="'#0F265C'"
        [Texto]="mode === 'add' ? 'Enviar' : 'Guardar'"
        [disabled]="loading || form.invalid"
        (click)="onSubmit()"
      />

      <app-custom-button 
        [colorBoton]="'#D9D9D9'"
        [ColorHoover]="'#D9D9D9'"
        [colorTexto]="'#0F265C'"
        [Texto]="'Reiniciar'"
        [disabled]="loading"
        (click)="onReset()"
      />

      <app-custom-button 
        *ngIf="mode === 'edit'"
        [colorBoton]="'#D9D9D9'"
        [ColorHoover]="'#D9D9D9'"
        [colorTexto]="'#0F265C'"
        [Texto]="'Cancelar'"
        [disabled]="loading"
        (click)="onCancel()"
      />
    </div>

    <div *ngIf="errorMsg" class="error-message" style="text-align:center; margin-top:12px;">{{ errorMsg }}</div>

  </form>

</div>
